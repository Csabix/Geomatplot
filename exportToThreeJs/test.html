<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js webgl - geometry - catmull spline editor</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      html {
        height: 100%;
        margin: 0;
      }
      body {
        background-color: #f0f0f0;
        color: #444;
        height: 100%;
        margin: 0;
      }

      #container {
        overflow: hidden;
        max-width: 100vw;
        max-height: 100vh;
        position: fixed;
        inset: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: repeating-linear-gradient(
            0deg,
            #e6e6e6 0,
            #e6e6e6 1px,
            transparent 1px,
            transparent 20px
          ),
          repeating-linear-gradient(
            90deg,
            #e6e6e6 0,
            #e6e6e6 1px,
            transparent 1px,
            transparent 20px
          ),
          #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/",
          "./point.js": "./point.js",
          "./curve.js": "./curve.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { point } from "./point.js";
      import {
        createUniformCurve,
        createCentripetalCurve,
        createChordalCurve,
      } from "./curve.js";

      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";

      let container;
      let camera, scene, renderer;
      const splineHelperObjects = [];
      let splinePointsLength = 4;
      const positions = [];
      const point_original = new THREE.Vector3();

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const onUpPosition = new THREE.Vector2();
      const onDownPosition = new THREE.Vector2();

      const geometry = new THREE.BoxGeometry(20, 20, 20);
      let transformControl;

      const ARC_SEGMENTS = 200;

      const splines = {};

      const params = {
        uniform: true,
        tension: 0.5,
        centripetal: true,
        chordal: true,
        addPoint: addPoint,
        removePoint: removePoint,
        exportSpline: exportSpline,
      };

      init();

      function init() {
        container = document.getElementById("container");

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          10000
        );

        camera.position.set(0, 500, 1000);
        camera.lookAt(0, 0, 0);
        scene.add(camera);

        const point_1 = point(scene, 200, 250);
        const point_2 = point(scene, 200, 500);
        const point_3 = point(scene, -200, 250);
        const point_4 = point(scene, -500, -100);

        createUniformCurve(scene, [point_1, point_2, point_3, point_4]);

        scene.add(new THREE.AmbientLight(0xf0f0f0, 3));
        const light = new THREE.SpotLight(0xffffff, 4.5);
        light.position.set(0, 1500, 200);
        light.angle = Math.PI * 0.2;
        light.decay = 0;
        scene.add(light);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        transformControl = new TransformControls(camera, renderer.domElement);
        transformControl.addEventListener("change", render);
        scene.add(transformControl);

        transformControl.addEventListener("objectChange", function () {
          updateSplineOutline();
        });

        document.addEventListener("pointerdown", onPointerDown);
        document.addEventListener("pointerup", onPointerUp);
        document.addEventListener("pointermove", onPointerMove);
        window.addEventListener("resize", onWindowResize);

        /*******
         * Curves
         *********/

        for (let i = 0; i < splinePointsLength; i++) {
          addSplineObject(positions[i]);
        }

        positions.length = 0;

        for (let i = 0; i < splinePointsLength; i++) {
          positions.push(splineHelperObjects[i].position);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(ARC_SEGMENTS * 3), 3)
        );

        let curve = new THREE.CatmullRomCurve3(positions);
        curve.curveType = "catmullrom";
        curve.mesh = new THREE.Line(
          geometry.clone(),
          new THREE.LineBasicMaterial({
            color: 0xff0000,
            opacity: 0.35,
          })
        );
        curve.mesh.castShadow = true;
        splines.uniform = curve;

        curve = new THREE.CatmullRomCurve3(positions);
        curve.curveType = "centripetal";
        curve.mesh = new THREE.Line(
          geometry.clone(),
          new THREE.LineBasicMaterial({
            color: 0x00ff00,
            opacity: 0.35,
          })
        );
        curve.mesh.castShadow = true;
        splines.centripetal = curve;

        curve = new THREE.CatmullRomCurve3(positions);
        curve.curveType = "chordal";
        curve.mesh = new THREE.Line(
          geometry.clone(),
          new THREE.LineBasicMaterial({
            color: 0x0000ff,
            opacity: 0.35,
          })
        );
        curve.mesh.castShadow = true;
        splines.chordal = curve;

        for (const k in splines) {
          const spline = splines[k];
          scene.add(spline.mesh);
        }

        load([
          new THREE.Vector3(
            289.76843686945404,
            452.51481137238443,
            56.10018915737797
          ),
          new THREE.Vector3(
            -53.56300074753207,
            171.49711742836848,
            -14.495472686253045
          ),
          new THREE.Vector3(
            -91.40118730204415,
            176.4306956436485,
            -6.958271935582161
          ),
          new THREE.Vector3(
            -383.785318791128,
            491.1365363371675,
            47.869296953772746
          ),
        ]);

        render();
      }

      function addSplineObject(position) {
        const material = new THREE.MeshLambertMaterial({
          color: Math.random() * 0xffffff,
        });
        const object = new THREE.Mesh(geometry, material);

        if (position) {
          object.position.copy(position);
        } else {
          object.position.x = Math.random() * 1000 - 500;
          object.position.y = Math.random() * 600;
          object.position.z = Math.random() * 800 - 400;
        }

        object.castShadow = true;
        object.receiveShadow = true;
        scene.add(object);
        splineHelperObjects.push(object);
        return object;
      }

      function addPoint() {
        splinePointsLength++;

        positions.push(addSplineObject().position);

        updateSplineOutline();

        render();
      }

      function removePoint() {
        if (splinePointsLength <= 4) {
          return;
        }

        const point_t = splineHelperObjects.pop();
        splinePointsLength--;
        positions.pop();

        if (transformControl.object === point_t) transformControl.detach();
        scene.remove(point_t);

        updateSplineOutline();

        render();
      }

      function updateSplineOutline() {
        for (const k in splines) {
          const spline = splines[k];

          const splineMesh = spline.mesh;
          const position = splineMesh.geometry.attributes.position;

          for (let i = 0; i < ARC_SEGMENTS; i++) {
            const t = i / (ARC_SEGMENTS - 1);
            spline.getPoint(t, point_original);
            position.setXYZ(
              i,
              point_original.x,
              point_original.y,
              point_original.z
            );
          }

          position.needsUpdate = true;
        }
      }

      function exportSpline() {
        const strplace = [];

        for (let i = 0; i < splinePointsLength; i++) {
          const p = splineHelperObjects[i].position;
          strplace.push(`new THREE.Vector3(${p.x}, ${p.y}, ${p.z})`);
        }

        console.log(strplace.join(",\n"));
        const code = "[" + strplace.join(",\n\t") + "]";
        prompt("copy and paste code", code);
      }

      function load(new_positions) {
        while (new_positions.length > positions.length) {
          addPoint();
        }

        while (new_positions.length < positions.length) {
          removePoint();
        }

        for (let i = 0; i < positions.length; i++) {
          positions[i].copy(new_positions[i]);
        }

        updateSplineOutline();
      }

      function render() {
        splines.uniform.mesh.visible = params.uniform;
        splines.centripetal.mesh.visible = params.centripetal;
        splines.chordal.mesh.visible = params.chordal;
        renderer.render(scene, camera);
      }

      function onPointerDown(event) {
        onDownPosition.x = event.clientX;
        onDownPosition.y = event.clientY;
      }

      function onPointerUp(event) {
        onUpPosition.x = event.clientX;
        onUpPosition.y = event.clientY;

        if (onDownPosition.distanceTo(onUpPosition) === 0) {
          transformControl.detach();
          render();
        }
      }

      function onPointerMove(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects(
          splineHelperObjects,
          false
        );

        if (intersects.length > 0) {
          const object = intersects[0].object;

          if (object !== transformControl.object) {
            transformControl.attach(object);
          }
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        render();
      }
    </script>
  </body>
</html>
