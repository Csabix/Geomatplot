<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js webgl - geometry - catmull spline editor</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      html {
        height: 100%;
        margin: 0;
      }
      body {
        background-color: #f0f0f0;
        color: #444;
        height: 100%;
        margin: 0;
      }

      #container {
        overflow: hidden;
        max-width: 100vw;
        max-height: 100vh;
        position: fixed;
        inset: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: repeating-linear-gradient(
            0deg,
            #e6e6e6 0,
            #e6e6e6 1px,
            transparent 1px,
            transparent 20px
          ),
          repeating-linear-gradient(
            90deg,
            #e6e6e6 0,
            #e6e6e6 1px,
            transparent 1px,
            transparent 20px
          ),
          #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/",
          "./point.js": "./point.js",
          "./curve.js": "./curve.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { point } from "./point.js";
      import {
        createUniformCurve,
        createCentripetalCurve,
        createChordalCurve,
      } from "./curve.js";

      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";

      let container;
      let camera, scene, renderer;

      init();

      function init() {
        container = document.getElementById("container");

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          10000
        );

        camera.position.set(0, 500, 1000);
        camera.lookAt(0, 0, 0);
        scene.add(camera);

        const point_1 = point(scene, 200, 250);
        const point_2 = point(scene, 200, 500);
        const point_3 = point(scene, -200, 250);
        const point_4 = point(scene, -500, -100);

        const point_5 = point(scene, 500, 50);
        const point_6 = point(scene, -500, -100);

        createUniformCurve(scene, [point_1, point_2, point_3, point_4]);
        createUniformCurve(scene, point_5, point_6, 0.5, "green");

        scene.add(new THREE.AmbientLight(0xf0f0f0, 3));
        const light = new THREE.SpotLight(0xffffff, 4.5);
        light.position.set(0, 1500, 200);
        light.angle = Math.PI * 0.2;
        light.decay = 0;
        scene.add(light);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        window.addEventListener("resize", onWindowResize);

        render();

        function render() {
          renderer.render(scene, camera);
        }

        function onWindowResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();

          renderer.setSize(window.innerWidth, window.innerHeight);

          render();
        }
      }
    </script>
  </body>
</html>
